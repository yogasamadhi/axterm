[global]
  server role = standalone server
  map to guest = Bad User
  guest account = nobody
  smb ports = 445
  server min protocol = SMB2
  disable netbios = yes
  load printers = no
  printcap name = /dev/null

[AXTERMTEST]
  path = /srv/axterm-share
  guest ok = yes
  guest only = yes
  read only = no
  browseable = no
  force user = nobody
  directory mask = 0777
  force directory mode = 0777
