name: Axterm independent release checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      # Immutable release commits prevent a later mutable action tag from
      # changing the source or artifact-producing release workflow.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Dependency installation and packaging do not need a checkout token.
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11.28.5'
          run_install: false
      - run: pnpm run snapshot:check
      - run: pnpm install --frozen-lockfile
      - run: pnpm run audit:dependencies
      - if: runner.os == 'Linux'
        run: pnpm run licenses:ironrdp:provenance-check
      - if: runner.os == 'Linux'
        run: pnpm exec playwright install-deps chromium
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y curl xvfb x11-utils python3-gi gir1.2-gtk-3.0 squashfs-tools
      - if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1920x1080x24' pnpm run check
      - if: runner.os != 'Linux'
        run: pnpm run check
      - if: runner.os == 'Linux'
        run: pnpm run test:ssh
      - name: Prepare pinned independent transfer peers
        if: runner.os == 'Linux'
        run: |
          docker pull debian@sha256:3783cc01769c7b2b1b83a5c5ad96c815348e28ed7da68e2e3687004faa906251
          curl --fail --location --silent --show-error --max-time 30 --output "$RUNNER_TEMP/lrzsz_0.12.21-10+b1_amd64.deb" https://deb.debian.org/debian/pool/main/l/lrzsz/lrzsz_0.12.21-10+b1_amd64.deb
      - name: Test independent lrzsz over SSH PTY
        if: runner.os == 'Linux'
        env:
          AXTERM_EXTERNAL_LRZSZ_SSH: '1'
          AXTERM_EXTERNAL_PEER_PLATFORM: linux/amd64
          AXTERM_EXTERNAL_LRZSZ_DEB: ${{ runner.temp }}/lrzsz_0.12.21-10+b1_amd64.deb
        run: pnpm exec vitest run packages/plugins/terminals/tests/terminal-transfer/external-lrzsz-ssh-pty.test.ts
      - name: Test independent trzsz-go over SSH PTY
        if: runner.os == 'Linux'
        env:
          AXTERM_EXTERNAL_TRZSZ_SSH: '1'
          AXTERM_EXTERNAL_PEER_PLATFORM: linux/amd64
        run: pnpm exec vitest run packages/plugins/terminals/tests/terminal-transfer/external-trzsz-ssh-pty.test.ts
      - if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1920x1080x24' pnpm exec playwright test --project=desktop --project=accessibility --project=performance
      - if: runner.os != 'Linux'
        run: pnpm exec playwright test --project=desktop --project=accessibility --project=performance
      - name: Package the checked Level 3 runtime closure
        run: |
          node -e "require('node:fs').mkdirSync('release/ci', {recursive:true})"
          node scripts/package-desktop.mjs --output "${{ github.workspace }}/release/ci"
          node scripts/level3-ci-artifacts.mjs release/ci
      - run: pnpm run sbom:packaged -- "${{ env.AXTERM_CI_RESOURCES }}" --platform ${{ env.AXTERM_CI_PLATFORM }} --output "${{ env.AXTERM_ARTIFACT_DIR }}/AXTERM_PACKAGED_ARTIFACTS.${{ env.AXTERM_CI_PLATFORM }}.spdx.json"
      - run: pnpm run release:hashes -- "${{ env.AXTERM_ARTIFACT_DIR }}" --platform ${{ env.AXTERM_CI_PLATFORM }} --output "${{ env.AXTERM_ARTIFACT_DIR }}/AXTERM_RELEASE_ARTIFACTS.${{ env.AXTERM_CI_PLATFORM }}.json"
      - if: runner.os == 'Linux'
        run: pnpm run test:deb:linux
      - if: runner.os == 'Linux'
        run: pnpm run test:appimage:linux
      - if: runner.os == 'Linux'
        run: pnpm run test:appimage:linux:runtime
      - if: runner.os == 'Windows'
        run: pnpm run test:nsis:windows
      - if: runner.os == 'macOS'
        run: pnpm run test:dmg:macos
      - if: runner.os == 'macOS'
        run: pnpm run test:ssh:packaged
      - run: pnpm run sbom:packaged:check -- "${{ env.AXTERM_CI_RESOURCES }}" --platform ${{ env.AXTERM_CI_PLATFORM }} --sidecar "${{ env.AXTERM_ARTIFACT_DIR }}/AXTERM_PACKAGED_ARTIFACTS.${{ env.AXTERM_CI_PLATFORM }}.spdx.json"
      - run: pnpm run release:updater-feed:package-check -- "${{ env.AXTERM_CI_RESOURCES }}"
      - run: pnpm run release:hashes:check -- "${{ env.AXTERM_ARTIFACT_DIR }}" --platform ${{ env.AXTERM_CI_PLATFORM }} --manifest "${{ env.AXTERM_ARTIFACT_DIR }}/AXTERM_RELEASE_ARTIFACTS.${{ env.AXTERM_CI_PLATFORM }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packaged-installers-${{ matrix.os }}
          path: |
            release/ci/*.dmg
            release/ci/*.zip
            release/ci/*.exe
            release/ci/*.AppImage
            release/ci/*.deb
            release/ci/*.blockmap
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packaged-sbom-${{ matrix.os }}
          path: release/ci/AXTERM_PACKAGED_ARTIFACTS.*.spdx.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packaged-artifact-hashes-${{ matrix.os }}
          path: release/ci/AXTERM_RELEASE_ARTIFACTS.*.json
          if-no-files-found: error
      - name: Download uploaded installers for byte verification
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packaged-installers-${{ matrix.os }}
          path: downloaded-release
      - name: Download uploaded hash manifest for byte verification
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packaged-artifact-hashes-${{ matrix.os }}
          path: downloaded-release
      - name: Download uploaded SPDX sidecar for byte verification
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packaged-sbom-${{ matrix.os }}
          path: downloaded-release
      - run: pnpm run release:hashes:check -- downloaded-release --platform ${{ env.AXTERM_CI_PLATFORM }} --manifest downloaded-release/AXTERM_RELEASE_ARTIFACTS.${{ env.AXTERM_CI_PLATFORM }}.json --receipt downloaded-release/AXTERM_UPLOAD_ROUNDTRIP.${{ env.AXTERM_CI_PLATFORM }}.json
      - run: pnpm run sbom:packaged:check -- "${{ env.AXTERM_CI_RESOURCES }}" --platform ${{ env.AXTERM_CI_PLATFORM }} --sidecar downloaded-release/AXTERM_PACKAGED_ARTIFACTS.${{ env.AXTERM_CI_PLATFORM }}.spdx.json --receipt downloaded-release/AXTERM_SPDX_UPLOAD_ROUNDTRIP.${{ env.AXTERM_CI_PLATFORM }}.json
      - if: runner.os == 'Linux'
        run: pnpm run test:appimage:linux -- --artifact-dir downloaded-release
      - if: runner.os == 'Linux'
        run: pnpm run test:appimage:linux:runtime -- --artifact-dir downloaded-release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packaged-upload-roundtrip-${{ matrix.os }}
          path: |
            downloaded-release/AXTERM_UPLOAD_ROUNDTRIP.*.json
            downloaded-release/AXTERM_SPDX_UPLOAD_ROUNDTRIP.*.json
            downloaded-release/AXTERM_APPIMAGE_RUNTIME.*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: diagnostics-${{ matrix.os }}
          path: test-results
