name: Axterm parity and release checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - if: runner.os == 'Linux'
        run: bun run test:ssh
      - if: runner.os == 'Linux'
        run: bunx playwright install-deps chromium
      - if: runner.os == 'Linux'
        run: xvfb-run -a bunx playwright test --project=desktop --project=accessibility --project=performance
      - if: runner.os != 'Linux'
        run: bunx playwright test --project=desktop --project=accessibility --project=performance
      - run: bun run package
      - if: runner.os == 'Linux'
        run: xvfb-run -a bun run test:packaged
      - if: runner.os == 'Windows'
        run: bun run test:packaged
      - if: runner.os == 'macOS'
        run: bun run test:dmg:macos
      - if: runner.os == 'Linux'
        run: xvfb-run -a bun run test:ssh:packaged
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-${{ matrix.os }}
          path: test-results
